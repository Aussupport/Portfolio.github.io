<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="AusNet Network Architecture Architecture Graphic">
  <defs>
    <linearGradient id="grad-line-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69BFA5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#173C35" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="grad-line-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8E8D8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#69BFA5" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8E8D8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#69BFA5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F5F7F4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="center-hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#69BFA5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#B8E8D8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F5F7F4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Light Soft Field -->
  <circle cx="480" cy="300" r="280" fill="url(#center-hub-glow)"/>

  <!-- Subtle Micro Grid Lines for Engineering Precision -->
  <g stroke="#E9EFEB" stroke-width="1" stroke-dasharray="4 6" opacity="0.85">
    <line x1="100" y1="150" x2="700" y2="150"/>
    <line x1="100" y1="300" x2="700" y2="300"/>
    <line x1="100" y1="450" x2="700" y2="450"/>
    <line x1="250" y1="80" x2="250" y2="520"/>
    <line x1="450" y1="80" x2="450" y2="520"/>
    <line x1="650" y1="80" x2="650" y2="520"/>
  </g>

  <!-- Geometric Coordinate Orbits (Subtle) -->
  <circle cx="450" cy="290" r="140" stroke="#69BFA5" stroke-width="1" stroke-dasharray="3 7" opacity="0.25"/>
  <circle cx="450" cy="290" r="210" stroke="#173C35" stroke-width="1" stroke-dasharray="2 8" opacity="0.12"/>

  <!-- Network Interconnection Paths -->
  <!-- Primary Mesh -->
  <path d="M 210,340 L 320,190 L 480,240 L 610,160" stroke="url(#grad-line-1)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 320,190 L 450,380 L 620,390" stroke="url(#grad-line-2)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 210,340 L 340,460 L 450,380 L 590,470" stroke="url(#grad-line-1)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 480,240 L 450,380" stroke="#69BFA5" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 480,240 L 620,390" stroke="#B8E8D8" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.6"/>
  <path d="M 320,190 L 340,460" stroke="#69BFA5" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.35"/>

  <!-- Secondary Cross-Connections -->
  <line x1="160" y1="240" x2="210" y2="340" stroke="#69BFA5" stroke-width="1.5" opacity="0.3"/>
  <line x1="610" y1="160" x2="680" y2="260" stroke="#69BFA5" stroke-width="1.5" opacity="0.35"/>
  <line x1="620" y1="390" x2="680" y2="260" stroke="#69BFA5" stroke-width="1.5" opacity="0.3"/>
  <line x1="620" y1="390" x2="590" y2="470" stroke="#173C35" stroke-width="1.5" opacity="0.2"/>

  <!-- Halo Node Rings -->
  <circle cx="480" cy="240" r="28" fill="url(#node-glow)"/>
  <circle cx="320" cy="190" r="22" fill="url(#node-glow)"/>
  <circle cx="450" cy="380" r="24" fill="url(#node-glow)"/>
  <circle cx="210" cy="340" r="18" fill="url(#node-glow)"/>
  <circle cx="610" cy="160" r="18" fill="url(#node-glow)"/>
  <circle cx="620" cy="390" r="20" fill="url(#node-glow)"/>

  <!-- Physical Network Node Points (Concentric Rings & Solid Center) -->
  <!-- Center Core Hub Node (Azure / Primary Bridge) -->
  <g transform="translate(480, 240)">
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" stroke="#69BFA5" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#173C35"/>
  </g>

  <!-- Node 2 (Cloud Infrastructure) -->
  <g transform="translate(320, 190)">
    <circle cx="0" cy="0" r="9" fill="#FFFFFF" stroke="#69BFA5" stroke-width="2"/>
    <circle cx="0" cy="0" r="4.5" fill="#69BFA5"/>
  </g>

  <!-- Node 3 (Cybersecurity / Identity Core) -->
  <g transform="translate(450, 380)">
    <circle cx="0" cy="0" r="10" fill="#FFFFFF" stroke="#173C35" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#173C35"/>
  </g>

  <!-- Node 4 (Modern Workplace) -->
  <g transform="translate(210, 340)">
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" stroke="#69BFA5" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="4" fill="#B8E8D8"/>
  </g>

  <!-- Node 5 (Consulting & Architecture) -->
  <g transform="translate(610, 160)">
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" stroke="#69BFA5" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="4" fill="#69BFA5"/>
  </g>

  <!-- Node 6 (AI & Automation) -->
  <g transform="translate(620, 390)">
    <circle cx="0" cy="0" r="9" fill="#FFFFFF" stroke="#173C35" stroke-width="2"/>
    <circle cx="0" cy="0" r="4.5" fill="#69BFA5"/>
  </g>

  <!-- Peripheral Satellite Nodes -->
  <circle cx="160" cy="240" r="3.5" fill="#69BFA5" opacity="0.6"/>
  <circle cx="340" cy="460" r="4.5" fill="#69BFA5" opacity="0.7"/>
  <circle cx="590" cy="470" r="4" fill="#173C35" opacity="0.5"/>
  <circle cx="680" cy="260" r="4" fill="#69BFA5" opacity="0.6"/>

  <!-- Subtle Data Flow Indicators (Small geometric markers) -->
  <circle cx="400" cy="215" r="2.5" fill="#69BFA5"/>
  <circle cx="385" cy="285" r="2" fill="#B8E8D8"/>
  <circle cx="535" cy="315" r="2.5" fill="#173C35" opacity="0.6"/>
  <circle cx="545" cy="200" r="2" fill="#69BFA5"/>
</svg>
