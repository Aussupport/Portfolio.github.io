<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="AusNet IT Solutions Logo">
  <title>AusNet IT Solutions</title>
  <defs>
    <linearGradient id="static-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4f5e2"/>
      <stop offset="100%" stop-color="#3fbf9e"/>
    </linearGradient>
  </defs>
  <!-- Base Container -->
  <rect x="0.8" y="0.8" width="62.4" height="62.4" rx="16.5" fill="#0f1b1f" stroke="url(#static-gradient)" stroke-width="1.6"/>
  
  <!-- Subtle Ambient Tech Points -->
  <g fill="#a6ead0" opacity="0.45">
    <circle cx="51" cy="48" r="1"/>
    <circle cx="17" cy="16" r="0.9"/>
    <circle cx="54" cy="13" r="0.8"/>
  </g>
  
  <!-- Network Structure & Connected Nodes -->
  <g>
    <!-- Primary Connecting Links -->
    <g stroke="#a6ead0" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75">
      <path d="M33 15 L29 49 M14 32 L48 27"/>
      <path d="M40 39 L31.6 29.8" stroke-width="1.6" opacity="0.6"/>
    </g>
    
    <!-- Accent Highlight Path -->
    <g stroke="#effff8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4">
      <path d="M33 15 L29 49"/>
      <path d="M14 32 L48 27"/>
    </g>
    
    <!-- Outer Node Rings -->
    <g fill="#a6ead0" opacity="0.22">
      <circle cx="33" cy="15" r="6.5"/>
      <circle cx="29" cy="49" r="7.8"/>
      <circle cx="14" cy="32" r="7.2"/>
      <circle cx="48" cy="27" r="6.0"/>
    </g>
    
    <!-- Node Cores -->
    <g fill="#c4f5e2">
      <circle cx="33" cy="15" r="3.9"/>
      <circle cx="29" cy="49" r="5.1"/>
      <circle cx="14" cy="32" r="4.5"/>
      <circle cx="48" cy="27" r="3.7"/>
      <circle cx="40" cy="39" r="2.4"/>
    </g>
  </g>
</svg>
