<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="AusNet IT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AusNet IT</title>
  <defs><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4f5e2"/><stop offset="1" stop-color="#3fbf9e"/></linearGradient></defs>
  <style>
    .c{transform-box:fill-box;transform-origin:center}
    .float{transform-origin:32px 32px;animation:an-float 6s ease-in-out infinite}
    .halo{animation:an-breathe 3s ease-in-out infinite}
    .core{animation:an-beat 3s ease-in-out infinite}
    .flow{stroke-dasharray:7 93;animation:an-flow 3s linear infinite}
    .tw{animation:an-tw 3s ease-in-out infinite}
    .d1{animation-delay:-.75s}.d2{animation-delay:-1.5s}.d3{animation-delay:-2.25s}
    @keyframes an-float{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
    @keyframes an-breathe{0%,100%{transform:scale(.8);opacity:.08}50%{transform:scale(1.3);opacity:.3}}
    @keyframes an-beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
    @keyframes an-flow{to{stroke-dashoffset:-100}}
    @keyframes an-tw{0%,100%{opacity:.15}50%{opacity:.9}}
    @media (prefers-reduced-motion:reduce){.float,.halo,.core,.flow,.tw{animation:none}.halo{opacity:.14}.flow{display:none}}
  </style>
  <rect x="0.8" y="0.8" width="62.4" height="62.4" rx="16.5" fill="#0f1b1f" stroke="url(#m)" stroke-width="1.6"/>
  <g fill="#a6ead0"><circle class="tw" cx="51" cy="48" r="1"/><circle class="tw d2" cx="17" cy="16" r=".9"/><circle class="tw d1" cx="54" cy="13" r=".8"/></g>
  <g class="float">
    <g stroke="#a6ead0" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path d="M33 15 L29 49 M14 32 L48 27" opacity=".7"/>
      <path d="M40 39 L31.6 29.8" stroke-width="1.6" opacity=".5"/>
    </g>
    <g stroke="#effff8" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path class="flow" pathLength="100" d="M33 15 L29 49"/>
      <path class="flow d2" pathLength="100" d="M14 32 L48 27"/>
      <path class="flow d1" pathLength="100" stroke-width="1.8" d="M31.6 29.8 L40 39"/>
    </g>
    <g fill="#a6ead0">
      <circle class="c halo" cx="33" cy="15" r="7"/><circle class="c halo d1" cx="29" cy="49" r="8.6"/>
      <circle class="c halo d2" cx="14" cy="32" r="7.6"/><circle class="c halo d3" cx="48" cy="27" r="6.4"/>
    </g>
    <g fill="#c4f5e2">
      <circle class="c core" cx="33" cy="15" r="3.9"/><circle class="c core d1" cx="29" cy="49" r="5.1"/>
      <circle class="c core d2" cx="14" cy="32" r="4.5"/><circle class="c core d3" cx="48" cy="27" r="3.7"/>
      <circle class="c core d1" cx="40" cy="39" r="2.4"/>
    </g>
  </g>
</svg>